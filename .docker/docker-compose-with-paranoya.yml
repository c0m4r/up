# Override for docker-compose.yml that adds the paranoya malware scanner (experimental):
#   git clone https://github.com/c0m4r/paranoya.git
#   docker compose -f docker-compose.yml -f .docker/docker-compose-with-paranoya.yml up -d --build
# Set "paranoya" => true and "paranoya_host" => 'paranoya' in config.php first.
#
# PHP-FPM writes uploads to /tmp, which is shared with the scanner through a
# dedicated volume instead of the host's /tmp.
services:
  php-fpm:
    tmpfs: !reset []
    volumes:
      - scan-tmp:/tmp
  paranoya:
    build: paranoya/addons/docker/default
    volumes:
      - scan-tmp:/tmp
    expose:
      - "1337"

volumes:
  scan-tmp:
