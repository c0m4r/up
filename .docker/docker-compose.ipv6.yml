# Override for docker-compose.yml that puts the stack on an IPv6-enabled network:
#   docker compose -f docker-compose.yml -f .docker/docker-compose.ipv6.yml up -d --build
services:
  server:
    networks:
      net6:
        ipv6_address: fd97:3e0c:cbdc::10
    dns: fd97:3e0c:cbdc::1
  php-fpm:
    networks:
      net6:
        ipv6_address: fd97:3e0c:cbdc::20
    dns: fd97:3e0c:cbdc::1

networks:
  net6:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: fd97:3e0c:cbdc::/48
          gateway: fd97:3e0c:cbdc::1
