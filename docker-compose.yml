# Images are built locally from the digest-pinned bases in the Dockerfile:
#   docker compose up -d --build
# Overrides in .docker/ add IPv6 or the paranoya scanner, e.g.:
#   docker compose -f docker-compose.yml -f .docker/docker-compose.ipv6.yml up -d --build
services:
  server:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    volumes:
      - type: volume
        source: uploads
        target: /usr/share/nginx/html/i
        read_only: true
        volume:
          nocopy: true
    depends_on:
      - php-fpm
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  php-fpm:
    build:
      context: .
      target: app
    volumes:
      - uploads:/usr/share/nginx/html/i
      - logs:/usr/share/nginx/html/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  uploads:
  logs:
